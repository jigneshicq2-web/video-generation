<html><head><link rel="stylesheet" href="base.css"><style>
.ad{background:#FFF8E6;background-image:linear-gradient(rgba(31,31,31,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(31,31,31,.04) 1px,transparent 1px);background-size:40px 40px;color:#1F1F1F}
h1{margin-top:48px;font-weight:800;font-size:72px;line-height:1.12;letter-spacing:-2px}
.card{width:900px;margin-top:52px;background:#fff;border-radius:28px;box-shadow:0 16px 40px rgba(0,0,0,.08);border:1px solid #E6E6E6;padding:36px 36px 30px;position:relative}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:14px}
.h{font-weight:600;font-size:24px;color:#6B6B6B;text-align:center}
.c{height:96px;border-radius:14px;background:#F6F6F6;display:flex;align-items:center;justify-content:center}
.c i{display:block;width:70%;height:30px;border-radius:9px}
.y{background:#FFCC43}.b{background:#1F1F1F}.g{background:#9A9A9A}.l{background:#DADADA}
.loop{position:absolute;right:-62px;top:50%;transform:translateY(-50%);width:96px}
.leg{display:flex;gap:34px;margin-top:26px;font-size:26px;font-weight:600}
.leg span{display:inline-flex;align-items:center;gap:10px}.leg b{width:22px;height:22px;border-radius:6px;display:inline-block}
p{margin-top:36px;font-size:38px;font-weight:500;line-height:1.3}
.cta{align-self:flex-start;margin-top:32px!important}
</style></head><body><div class="ad">
<img class="logo" src="logo-black.webp">
<h1>Tips, testimonials, offers...<br><span class="hl">which one goes out today?</span></h1>
<div class="card"><div class="grid" id="g"></div>
<svg class="loop" viewBox="0 0 100 100"><path d="M50 12a38 38 0 1 1-36 26" fill="none" stroke="#FFCC43" stroke-width="11" stroke-linecap="round"/><path d="M2 30l14 18 14-20z" fill="#FFCC43"/></svg>
<div class="leg"><span><b class="y"></b>Tips</span><span><b class="b"></b>Testimonials</span><span><b class="g"></b>Offers</span><span><b class="l"></b>Blog</span></div></div>
<p>Category schedules decide. On repeat. Automatically.</p>
<div class="cta push">Build Your Content Mix <span>&gt;</span></div>
<script>const d=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],m={Mon:'l',Tue:'y',Thu:'l',Fri:'b',Sun:'g'};let h='';d.forEach(x=>h+=`<div class=h>${x}</div>`);for(let w=0;w<3;w++)d.forEach(x=>h+=`<div class=c>${m[x]?`<i class=${m[x]}></i>`:''}</div>`);document.getElementById('g').innerHTML=h</script>
</div></body></html>
